[tox]
envlist = begin,py3{8,10,11,12,13,14},end
          py3{8,10,11,12,13,14}-functional
          ruff,ruff-check,mypy
minversion = 2.0
skipsdist = true
skip_missing_interpreters = true


[testenv]
runner = uv-venv-lock-runner
extras =
  test
  testenv
setenv =
  PACKAGE_NAME=restalchemy
  TEST_PATH={env:PACKAGE_NAME}/tests/unit
  # Each environment writes its own data file so that parallel test runs and
  # several interpreters do not overwrite each other; "end" combines them.
  COVERAGE_FILE={toxinidir}/.coverage.{envname}
  functional: TEST_PATH={env:PACKAGE_NAME}/tests/functional
  functional: DATABASE_URI={env:DATABASE_URI:mysql://root:@{env:MYSQL_HOSTNAME:localhost}:3306/{env:MYSQL_DATABASE:radatabase}}
passenv =
  functional: MYSQL_HOSTNAME
  functional: MYSQL_DATABASE
  functional: DATABASE_URI
commands =
  # pytest-cov is required here: plain "coverage run" does not measure the
  # pytest-xdist worker processes, which silently yields an empty report.
  pytest {posargs} --timer-top-n=10 -n 10 --cov --cov-report= {env:TEST_PATH}

[testenv:begin]
runner = uv-venv-lock-runner
envdir = {toxworkdir}/cover
# Override the per-environment COVERAGE_FILE: erase and combine have to work on
# the base data file, otherwise they look for ".coverage.begin.*"/".coverage.end.*".
setenv =
  COVERAGE_FILE={toxinidir}/.coverage
commands =
  coverage erase

[testenv:end]
runner = uv-venv-lock-runner
envdir = {toxworkdir}/cover
setenv =
  COVERAGE_FILE={toxinidir}/.coverage
commands =
  coverage combine
  coverage html -d cover
  coverage xml -o cover/coverage.xml
  coverage report --skip-covered

[testenv:venv]
commands = {posargs}

[testenv:ruff-check]
extras =
  ruff
runner = uv-venv-lock-runner
commands = ruff check .

[testenv:ruff]
extras =
  ruff
runner = uv-venv-lock-runner
commands =
  ruff check . --fix
  ruff check --select I --fix
  ruff format

[testenv:mypy]
extras =
  mypy
runner = uv-venv-lock-runner
commands = mypy -p restalchemy

[testenv:docs]
basepython = python3
runner = uv-venv-lock-runner
extras =
  docs
commands = zensical serve --dev-addr 0.0.0.0:8181

[testenv:docs-build]
basepython = python3
runner = uv-venv-lock-runner
extras =
  docs
commands = zensical build --clean

[testenv:develop]
runner = uv-venv-lock-runner
extras =
  test
usedevelop=true
