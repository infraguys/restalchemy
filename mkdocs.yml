site_name: RESTAlchemy
site_url: https://infraguys.github.io/restalchemy/
site_description: REST HTTP Abstraction Library
repo_name: restalchemy
repo_url: https://github.com/infraguys/restalchemy
edit_uri: browse/docs/
copyright: Copyright &copy; 2025-2026 Genesis Corporation

theme:
  name: zensical
  variant: modern
  language: en
  features:
    - search.suggest
    - search.highlight
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: lucide/moon
        name: Switch to light mode

plugins:
  - search

# zensical has no i18n support yet (mkdocs-static-i18n is not one of the plugins
# it implements), so every language is a folder under docs/ with its own nav
# section, and the languages are interlinked through extra.alternate below.
extra:
  repo_icon: github
  alternate:
    - name: English
      link: en/
      lang: en
    - name: Русский
      link: ru/
      lang: ru
    - name: Deutsch
      link: de/
      lang: de
    - name: 中文
      link: zh/
      lang: zh

markdown_extensions:
  - meta
  - admonition
  - footnotes
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - toc:
      slugify: !!python/name:pymdownx.slugs.uslugify
      permalink: '#'
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      preserve_tabs: true
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true

