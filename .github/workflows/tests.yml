name: tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  Lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install tox-uv
        run: uv tool install tox --with tox-uv
      - name: ruff
        run: |
          tox -e ruff-check
  tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.8", "3.10", "3.11", "3.12", "3.13", "3.14"]
    services:
      mariadb:
        image: mariadb:latest
        ports:
          - 3306:3306
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
          MARIADB_DATABASE: ra_database
          MARIADB_USER: root
          MYSQL_ROOT_PASSWORD: test_password
        options: >-
          --ulimit nofile=65536:65536
          --health-cmd="healthcheck.sh
          --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      postgresql:
        image: postgres:latest
        # Provide the password for postgres
        env:
          POSTGRES_DB: ra_database
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_INITDB_ARGS: "-c max_connections=100"
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install tox-uv
        run: uv tool install tox --with tox-uv
      - name: Unit tests
        env:
          # The ".coverage." prefix is required by "coverage combine", which
          # the coverage job runs over every artifact collected here.
          COVERAGE_FILE: ".coverage.${{ matrix.python-version }}-unit"
        run: |
          tox -e ${{ matrix.python-version }}
      - name: Functional MySQL tests
        env:
          DATABASE_URI: "mysql://root:test_password@localhost:3306/ra_database"
          COVERAGE_FILE: ".coverage.${{ matrix.python-version }}-mysql"
        run: |
          tox -e ${{ matrix.python-version }}-functional
      - name: Functional PostgreSQL tests
        env:
          DATABASE_URI: "postgresql://postgres:test_password@localhost:5432/ra_database"
          COVERAGE_FILE: ".coverage.${{ matrix.python-version }}-pgsql"
        run: |
          tox -e ${{ matrix.python-version }}-functional
      - name: Store coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage.${{ matrix.python-version }}-*
          include-hidden-files: true

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    needs: tests
    permissions:
      # Forked pull_request runs are downgraded to read-only by GitHub, so
      # these do not grant write access to untrusted code.
      pull-requests: write  # Publish the coverage comment and update it later
      contents: write  # Push the coverage data to the data branch
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v4
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_COVERAGE_FILES: true
      - name: Store the comment to be posted for a forked pull request
        uses: actions/upload-artifact@v7
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
