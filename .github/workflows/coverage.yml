name: coverage comment

# zizmor: ignore[dangerous-triggers]
# A pull request from a fork runs with a read-only token, so the tests
# workflow cannot post the coverage comment itself. It stores the comment as
# an artifact instead, and this workflow, which runs in the context of the
# base repository, posts it. The forked code is never checked out or run here.
on:
  workflow_run:
    workflows: ["tests"]
    types:
      - completed

concurrency:
  # Group by the pull request's repository and branch: "github.ref" is always
  # the default branch on "workflow_run", so runs for different pull requests
  # would otherwise cancel each other. Forks commonly propose a branch named
  # "master" or "patch-1", so the branch alone does not tell them apart.
  group: >-
    ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  post:
    name: Post the coverage comment
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    permissions:
      pull-requests: write  # Post the comment and edit it on later runs
      actions: read  # Download the comment artifact from the tests run
      contents: read
    steps:
      # Do not check out the repository here: this workflow is triggered by
      # potentially untrusted code and runs with a writable token.
      # https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
      - name: Post comment
        uses: py-cov-action/python-coverage-comment-action@v4.3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}
